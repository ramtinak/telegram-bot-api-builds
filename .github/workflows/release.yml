name: Build Telegram Bot API

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows x64
    runs-on: windows-2025

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Visual Studio
        uses: microsoft/setup-msbuild@v2

      - name: Check build tools
        shell: pwsh
        run: |
          cmake --version
          msbuild -version
          git --version

      - name: Clone vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$env:GITHUB_WORKSPACE\vcpkg"

      - name: Bootstrap vcpkg
        shell: pwsh
        working-directory: ${{ github.workspace }}\vcpkg
        run: |
          .\bootstrap-vcpkg.bat

      - name: Install Windows dependencies
        shell: pwsh
        working-directory: ${{ github.workspace }}\vcpkg
        run: |
          .\vcpkg.exe install `
            gperf:x64-windows `
            openssl:x64-windows `
            zlib:x64-windows

      - name: Configure
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          if (Test-Path build) {
            Remove-Item build -Recurse -Force
          }

          New-Item -ItemType Directory -Path build | Out-Null
          Set-Location build

          cmake `
            -A x64 `
            -DCMAKE_INSTALL_PREFIX:PATH="${{ github.workspace }}\install" `
            -DCMAKE_TOOLCHAIN_FILE:FILEPATH="${{ github.workspace }}\vcpkg\scripts\buildsystems\vcpkg.cmake" `
            ..

      - name: Build
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          cmake --build build --target install --config Release --parallel

      - name: Verify Windows binary
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          if (!(Test-Path "install\bin\telegram-bot-api.exe")) {
            Write-Error "telegram-bot-api.exe was not produced"
            exit 1
          }

          Get-ChildItem "install\bin"

      - name: Package Windows x64
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          Compress-Archive `
            -Path "install\bin\*" `
            -DestinationPath "telegram-bot-api-windows-x64.zip" `
            -CompressionLevel Optimal

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v6
        with:
          name: telegram-bot-api-windows-x64
          path: telegram-bot-api-windows-x64.zip
          if-no-files-found: error

  build-linux:
    name: Ubuntu 24.04 x64
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            make \
            git \
            zlib1g-dev \
            libssl-dev \
            gperf \
            cmake \
            clang-18 \
            libc++-18-dev \
            libc++abi-18-dev

      - name: Check build tools
        run: |
          cmake --version
          clang-18 --version
          git --version

      - name: Configure
        working-directory: ${{ github.workspace }}
        run: |
          rm -rf build
          mkdir build
          cd build

          CXXFLAGS="-stdlib=libc++" \
          CC=/usr/bin/clang-18 \
          CXX=/usr/bin/clang++-18 \
          cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX:PATH="${{ github.workspace }}/install" \
            ..

      - name: Build
        working-directory: ${{ github.workspace }}
        run: |
          cmake --build build --target install --parallel

      - name: Verify Linux binary
        working-directory: ${{ github.workspace }}
        run: |
          test -f install/bin/telegram-bot-api
          file install/bin/telegram-bot-api
          chmod +x install/bin/telegram-bot-api

      - name: Package Ubuntu x64
        working-directory: ${{ github.workspace }}
        run: |
          tar -C install/bin \
            -czf telegram-bot-api-linux-x64.tar.gz \
            telegram-bot-api

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v6
        with:
          name: telegram-bot-api-linux-x64
          path: telegram-bot-api-linux-x64.tar.gz
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs:
      - build-windows
      - build-linux
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v5
        with:
          name: telegram-bot-api-windows-x64
          path: release

      - name: Download Linux artifact
        uses: actions/download-artifact@v5
        with:
          name: telegram-bot-api-linux-x64
          path: release

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            release/telegram-bot-api-windows-x64.zip \
            release/telegram-bot-api-linux-x64.tar.gz \
            --repo "${{ github.repository }}" \
            --title "Telegram Bot API ${{ github.ref_name }}" \
            --generate-notes
